function setupAudio(){if(ctx){if(ctx.state==='suspended')ctx.resume();return}const C=window.AudioContext||window.webkitAudioContext;ctx=new C();output=ctx.createGain();output.gain.value=.8;output.connect(ctx.destination);pianoGain=ctx.createGain();pianoGain.gain.value=.85;pianoGain.connect(output);guitarGain=ctx.createGain();guitarGain.gain.value=.38;guitarGain.connect(output);if(window.JamNylon){nylon=new window.JamNylon(ctx,guitarGain);nylon.load().then(x=>{if(x.loaded<5)console.warn('Nylon sample bank unavailable; using softer synthesis')})}ambGain=ctx.createGain();ambGain.gain.value=.085;ambGain.connect(output);uiGain=ctx.createGain();uiGain.gain.value=.15;uiGain.connect(output)}
const semis=noteToPc;function pitch(note){return 261.6256*Math.pow(2,semis[note]/12)}
function piano(note,at=ctx.currentTime,velocity=.65){if(!ctx)return;const f=pitch(note);let env=ctx.createGain(),filter=ctx.createBiquadFilter();filter.type='lowpass';filter.frequency.setValueAtTime(3400,at);filter.frequency.exponentialRampToValueAtTime(1050,at+.3);env.gain.setValueAtTime(.0001,at);env.gain.exponentialRampToValueAtTime(.13*velocity,at+.012);env.gain.exponentialRampToValueAtTime(.001,at+1.25);filter.connect(env);env.connect(pianoGain);[1,2,3].forEach((harm,i)=>{let osc=ctx.createOscillator();osc.type=i?'sine':'triangle';osc.frequency.value=f*harm;let og=ctx.createGain();og.gain.value=[1,.14,.055][i];osc.connect(og);og.connect(filter);osc.start(at);osc.stop(at+1.28)})}
function chordAt(beat){let bar=Math.floor(Math.max(0,beat)/4),c=song.chords[bar%song.chords.length];return roots[c]||roots.C}
function guitarStrum(at,beat){
 if(!nylon||!ctx)return;
 const freqs=chordAt(beat),midis=freqs.map(f=>Math.round(69+12*Math.log2(f/440))),barBeat=Math.floor(Math.max(0,beat))%4;
 // Gentle classical guitar arpeggio, avoiding a loud identical strum every beat.
 if(barBeat===0){nylon.play(midis[0],at,.57,2.0);nylon.play(midis[1]+12,at+.12,.38,1.6);nylon.play(midis[2]+12,at+.27,.35,1.65)}
 else if(barBeat===1){nylon.play(midis[1]+12,at,.33,1.3);nylon.play(midis[2]+12,at+.27,.28,1.2)}
 else if(barBeat===2){nylon.play(midis[0],at,.40,1.7);nylon.play(midis[2]+12,at+.18,.34,1.4)}
 else{nylon.play(midis[1]+12,at+.10,.30,1.4);nylon.play(midis[2]+12,at+.34,.26,1.2)}
 const ms=Math.max(0,(at-ctx.currentTime)*1000);
 setTimeout(()=>{if(running&&!paused){$('avatar').classList.remove('strum','bob');void $('avatar').offsetWidth;$('avatar').classList.add('strum','bob');setTimeout(()=>$('avatar').classList.remove('strum'),170)}},ms);
}
function softTone(freq,at,seconds=.9,vol=.16){if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();o.type='sine';o.frequency.setValueAtTime(freq,at);f.type='lowpass';f.frequency.value=900;g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),at+.06);g.gain.exponentialRampToValueAtTime(.0001,at+seconds);o.connect(f);f.connect(g);g.connect(ambGain);o.start(at);o.stop(at+seconds+.02)}
function sparkle(){if(!ctx)return;const at=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(660,at);o.frequency.exponentialRampToValueAtTime(1100,at+.11);g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(.14,at+.01);g.gain.exponentialRampToValueAtTime(.0001,at+.19);o.connect(g);g.connect(uiGain);o.start(at);o.stop(at+.2)}
function stopAmbient(){ambActive=false;if(ambTimer){clearInterval(ambTimer);ambTimer=0}}
function startAmbient(){unlock();if(ambActive||!ctx||running)return;ambActive=true;ambStep=0;const notes=[261.63,329.63,392,329.63,220,261.63,329.63,261.63,174.61,261.63,349.23,261.63,196,246.94,293.66,246.94];const play=()=>{if(!ambActive||running)return;const t=ctx.currentTime+.025;softTone(notes[ambStep%notes.length],t,1.35,.22);if(ambStep%4===0)softTone([130.81,220,174.61,196][Math.floor(ambStep/4)%4],t,1.9,.12);ambStep++};play();ambTimer=setInterval(play,670)}
function unlock(){try{setupAudio();ctx.resume()}catch(e){console.error(e)}}
function beatNow(){if(!running)return 0;if(paused)return pauseTime;return (ctx.currentTime-songStart)*song.bpm/60*speed}
function setTime(beat){songStart=ctx.currentTime-beat*60/(song.bpm*speed)}
function render(){if(!song)return;const box=$('highway').getBoundingClientRect(),w=box.width,h=box.height,dpr=Math.min(devicePixelRatio||1,2);if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);const now=beatNow(),bps=song.bpm*speed/60,travelBeats=noteTravel*bps,hitY=h*.86,laneW=w/7;
for(const n of song.melody){if(n.done)continue;const delta=n.beat-now;const y=hitY-delta/travelBeats*(h*.93);if(y< -45||y>h+45)continue;const isSharp=n.note.endsWith('#'),i=isSharp?letters.indexOf(n.note[0]):letters.indexOf(n.note),width=isSharp?laneW*.7:laneW-6,x=isSharp?(i+1)*laneW-width/2:i*laneW+3,nh=Math.min(50,Math.max(18,n.length*21));g.fillStyle=isSharp?'#e2b5f6':colors[i];g.shadowColor=isSharp?'#e2b5f6':colors[i];g.shadowBlur=11;g.beginPath();g.roundRect(x,y-nh,width,nh,7);g.fill();g.shadowBlur=0;g.fillStyle='#283448';g.font='900 14px system-ui';g.textAlign='center';g.fillText(n.note,x+width/2,y-nh/2+5)}
$('progress').style.width=Math.min(100,Math.max(0,now/song.total*100))+'%';if(running&&!paused){currentSong=now;autoMiss(now);if(now>song.total+3)finish();if(Date.now()-lastJudgmentAt>850){$('judgement').textContent=''}}raf=requestAnimationFrame(render)}
function autoMiss(now){let bad=false;for(const n of song.melody){if(!n.done&&n.beat<now-.22*song.bpm*speed/60){if(mode==='practice'&&waitMode){paused=true;pauseTime=n.beat;waiting=true;waitingIndex=song.melody.indexOf(n);$('speech').textContent=`Play ${n.note} 🎹`;return}n.done=true;combo=0;judgments++;bad=true}}if(bad){$('speech').textContent='Keep going! 💛';updateHUD()}}
function hit(note){unlock();if(!song){piano(note);return}piano(note);const key=$('key-'+note);key.classList.add('active');setTimeout(()=>key.classList.remove('active'),130);if(!running||paused&&!waiting)return;let now=beatNow();if(waiting){const n=song.melody[waitingIndex];if(n&&n.note===note){n.done=true;hits++;judgments++;combo++;maxCombo=Math.max(maxCombo,combo);score+=100;waiting=false;paused=false;setTime(n.beat+.01);judge('PERFECT!','#baffd5');$('speech').textContent='You got it! 🎸';updateHUD()}return}
const beatWindow=.14*song.bpm*speed/60,candidates=song.melody.filter(n=>!n.done&&n.note===note&&Math.abs(n.beat-now)<=beatWindow).sort((a,b)=>Math.abs(a.beat-now)-Math.abs(b.beat-now));let n=candidates[0];if(!n)return;let dif=Math.abs(n.beat-now)*60/(song.bpm*speed)*1000;let points=dif<=45?100:dif<=90?70:40;n.done=true;score+=points;hits++;judgments++;combo++;maxCombo=Math.max(maxCombo,combo);judge(points===100?'PERFECT!':points===70?'GREAT!':'GOOD!',points===100?'#baffd5':'#ffe09a');$('speech').textContent=combo>=10?'Amazing combo! 🔥':'Nice one! 🎶';updateHUD()}
function judge(s,c){if(s==='PERFECT!')sparkle();$('judgement').textContent=s;$('judgement').style.color=c;lastJudgmentAt=Date.now()}
function updateHUD(){$('score').textContent=String(score).padStart(5,'0');$('combo').textContent='COMBO ×'+combo;$('accuracy').textContent='ACCURACY '+(judgments?Math.round(hits/judgments*100)+'%':'—')}
function audioScheduler(){
 if(!running||paused||!ctx)return;const now=beatNow(),ahead=.26*song.bpm*speed/60,beatToSeconds=60/(song.bpm*speed);
 if(song.guitarEvents?.length){
  while(nextGuitarIndex<song.guitarEvents.length&&song.guitarEvents[nextGuitarIndex].beat<=now+ahead){
   const e=song.guitarEvents[nextGuitarIndex++];
   if(e.beat>=now-.14&&nylon)nylon.play(e.midi,Math.max(ctx.currentTime+.004,ctx.currentTime+(e.beat-now)*beatToSeconds),e.velocity||.4,1.75);
  }
  return;
 }
 while(nextStrum<=now+ahead&&nextStrum<song.total){
  if(nextStrum>=now-.14){const due=ctx.currentTime+(nextStrum-now)*beatToSeconds;guitarStrum(Math.max(ctx.currentTime+.005,due),nextStrum)}nextStrum++;
 }
}
function start(){if(pendingShape||!songs.length){show(songSelect());return}unlock();stopAmbient();stop();song=songs[selected];song.melody.forEach(n=>n.done=false);score=combo=maxCombo=judgments=hits=0;running=true;paused=false;waiting=false;nextStrum=0;nextGuitarIndex=0;setTime(-4);$('songTitle').textContent=song.title;$('modeLabel').textContent=mode==='jam'?'JAM MODE 🎸':'PRACTICE 🎼';$('speech').textContent='1, 2, 3, 4!';$('progress').style.width='0%';updateHUD();hide();render();scheduler=setInterval(audioScheduler,35)}
function stop(){running=false;paused=false;waiting=false;clearInterval(scheduler);cancelAnimationFrame(raf)}
function pause(){if(!running)return;if(paused){paused=false;setTime(pauseTime);hide();$('speech').textContent='Let’s go! 🎸'}else{pauseTime=beatNow();paused=true;show(`<h1 class="brand">PAUSED ♫</h1><p class="tag">Your guitarist is right here.</p><div class="settings"><label>Mode <select id="modeSelect"><option value="jam" ${mode==='jam'?'selected':''}>Jam</option><option value="practice" ${mode==='practice'?'selected':''}>Practice</option></select></label><label>Speed <select id="speedSelect"><option value="0.5" ${speed===.5?'selected':''}>50%</option><option value="0.75" ${speed===.75?'selected':''}>75%</option><option value="1" ${speed===1?'selected':''}>100%</option></select></label><label>Wait for notes (Practice) <input id="waitToggle" type="checkbox" ${waitMode?'checked':''}></label><label>Guitar volume <input id="gvol" type="range" min="0" max="100" value="${guitarGain?Math.round(guitarGain.gain.value*100):38}"></label><label>Piano volume <input id="pvol" type="range" min="0" max="100" value="${pianoGain?Math.round(pianoGain.gain.value*100):85}"></label>${sliderHtml()}</div><button class="primary" id="resume">RESUME ▶</button><button class="secondary" id="restart">Restart song</button><button class="secondary" id="backSongs">Change song</button>`)} }
function finish(){if(ended)return;ended=true;stop();const pct=judgments?Math.round(hits/judgments*100):0;show(`<h1 class="brand">SONG COMPLETE! 🎉</h1><img class="portrait" src="character.jpg"><p class="tag">That was a great jam session!</p><h2 style="margin:0;font-size:34px">${score.toLocaleString()} ✨</h2><p>Accuracy ${pct}% · Best combo ${maxCombo}</p><button class="primary" id="restart">PLAY AGAIN</button><button class="secondary" id="nextSong">NEXT SONG →</button><button class="secondary" id="backSongs">Songs</button>`);$('speech').textContent='We did it! 🎸'}
function midiText(d,p,n){return String.fromCharCode(...d.slice(p,p+n))}
function readVar(d,pos){let v=0,j=0;while(pos.i<d.length&&j++<4){const b=d[pos.i++];v=(v<<7)|(b&127);if(!(b&128))break}return v}
function importMidi(file){
 if(!file)return;
 const reader=new FileReader();
 const report=message=>{const status=$('importStatus');if(status)status.textContent=message};
 reader.onerror=()=>report('Could not read the MIDI file.');
 reader.onload=()=>{
  try{
   if(!window.JamMidi)throw Error('The MIDI analyzer could not load. Refresh the page.');
   const analysis=window.JamMidi.analyze(reader.result);
   const rawTitle=file.name.replace(/\.midi?$/i,'');
   const isShape=pendingShape||/shape.*(of.*)?heart/i.test(rawTitle);
   const title=isShape?'Shape of My Heart — melody only':rawTitle;
   const reportDetails='Separated '+analysis.stats.melodyNotes+' melody notes from '+analysis.stats.chordNotes+' accompaniment notes. Guitar plays '+analysis.stats.chordChanges+' chord changes independently.';
   const shift=analysis.transpose;
   const imported={
    title,subtitle:'Melody only · classical guitar · '+(shift?'transposed '+(shift>0?'+':'')+shift:'original key'),
    bpm:analysis.bpm,melody:analysis.melody,guitarEvents:analysis.guitarEvents,chordLabels:analysis.chordLabels,
    chords:['Am','F','C','G'],difficulty:'CUSTOM',total:analysis.total,custom:adminUnlocked
   };
   // Never delete the user's older import without asking; save a new corrected version.
   songs.push(imported);selected=songs.length-1;pendingShape=false;
   if(adminUnlocked&&!persistLibrary())console.warn('MIDI import not saved (browser storage quota).');
   show(adminUnlocked?adminPanel():songSelect());
   report(reportDetails+' '+analysis.stats.whiteNotes+' of '+analysis.stats.melodyNotes+' melody notes use white keys. '+(adminUnlocked?'Saved on this device.':'Temporary until added through Song Manager.'));
   window.lastMidiReport={...analysis.stats,transpose:analysis.transpose,title};
   sparkle();
  }catch(err){report('MIDI import failed: '+err.message);console.error('MIDI import error',err)}
 };
 reader.readAsArrayBuffer(file);
}
function bindKeys(){const root=$('keys');root.innerHTML=letters.map((n,i)=>`<button id="key-${n}" data-note="${n}" class="key" style="--keycolor:${colors[i]}" aria-label="Piano note ${n}">${n}<span>♪</span></button>`).join('')+
[['C#',1],['D#',2],['F#',4],['G#',5],['A#',6]].map(([n,b])=>`<button id="key-${n}" data-note="${n}" class="sharp" style="--boundary:${b}" aria-label="Black key ${n}">${n}</button>`).join('');
$('lanes').innerHTML=letters.map(()=>'<div class="lane"></div>').join('');
root.querySelectorAll('.key,.sharp').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);hit(b.dataset.note)})});
const keyInput={a:'C',w:'C#',s:'D',e:'D#',d:'E',f:'F',t:'F#',j:'G',y:'G#',k:'A',u:'A#',l:'B'};
document.addEventListener('keydown',e=>{if(e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;
if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName)||document.activeElement?.isContentEditable)return;
const note=keyInput[e.key.toLowerCase()];if(note){e.preventDefault();hit(note)}if(e.code==='Space'&&running){e.preventDefault();if(!$('overlay').classList.contains('hidden')&&$('resume'))pause();else if($('overlay').classList.contains('hidden'))pause()}})}

$('pauseBtn').onclick=()=>pause();
$('panel').addEventListener('input',e=>{if(e.target.id==='keyHeight')setKeyHeight(e.target.value)});
$('panel').addEventListener('change',e=>{
if(e.target.id==='songDropdown'){pendingShape=e.target.value==='shape';if(!pendingShape)selected=Number(e.target.value);show(songSelect())}
if((e.target.id==='midiInput'||e.target.id==='midiAdminInput')&&e.target.files?.[0]){unlock();importMidi(e.target.files[0])}
if(e.target.id==='coverInput'&&e.target.files?.[0]){const f=e.target.files[0];if(window.coverAudioUrl)URL.revokeObjectURL(window.coverAudioUrl);window.coverAudioUrl=URL.createObjectURL(f);const player=document.createElement('audio');player.className='coveraudio';player.controls=true;player.src=window.coverAudioUrl;const box=$('coverPlayer');if(box)box.replaceChildren(player)}
});
$('panel').addEventListener('click',async e=>{const t=e.target.closest('button');if(!t)return;
if(t.dataset.delete!=null){removeLibrarySong(Number(t.dataset.delete));return}
switch(t.id){
case'choose':case'backSongs':stop();stopAmbient();show(songSelect());break;
case'ambience':if(ambActive)stopAmbient();else startAmbient();home();break;
case'goHome':home();break;
case'openAdmin':adminUnlocked?show(adminPanel()):adminLogin();break;
case'adminUnlock':{const pass=$('adminPass')?.value||'';const valid=await verifyPassword(pass);if(valid){adminUnlocked=true;show(adminPanel())}else{const err=$('adminError');if(err)err.textContent='Incorrect password.'}break}
case'addSong':{if(!adminUnlocked)return;try{const title=($('newTitle')?.value||'').trim().slice(0,75),bpm=Math.max(50,Math.min(200,Number($('newBpm')?.value)||100));if(!title)throw Error('Please enter a title');const notes=parseNotes($('newNotes')?.value||'');const custom=makeSong(title,'Custom · White-key friendly',bpm,notes,['C','Am','F','G'],'CUSTOM');custom.custom=true;songs.push(custom);selected=songs.length-1;pendingShape=false;if(!persistLibrary())alert('Could not save: your browser storage may be full.');show(adminPanel())}catch(err){alert(err.message)}break}
case'restoreSongs':restoreDefaults();break;
case'lockAdmin':adminUnlocked=false;show(songSelect());break;
case'start':case'restart':ended=false;start();break;
case'nextSong':if(songs.length){selected=(selected+1)%songs.length;pendingShape=false;ended=false;start()}break;
case'resume':{const selectedMode=$('modeSelect')?.value||mode,selectedSpeed=+$('speedSelect')?.value||speed;const oldBeat=pauseTime;mode=selectedMode;speed=selectedSpeed;waitMode=$('waitToggle')?.checked||false;guitarGain.gain.value=+$('gvol').value/100;pianoGain.gain.value=+$('pvol').value/100;nextStrum=Math.ceil(oldBeat);nextGuitarIndex=song?.guitarEvents?.findIndex(e=>e.beat>=oldBeat)??0;if(nextGuitarIndex<0)nextGuitarIndex=song?.guitarEvents?.length||0;setTime(oldBeat);paused=false;waiting=false;hide();$('modeLabel').textContent=mode==='jam'?'JAM MODE 🎸':'PRACTICE 🎼';break}
}});
window.addEventListener('blur',()=>{if(running&&!paused)pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&running&&!paused)pause()});bindKeys();home();
})();

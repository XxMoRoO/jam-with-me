function setupAudio(){if(ctx){if(ctx.state==='suspended')ctx.resume();return}const C=window.AudioContext||window.webkitAudioContext;ctx=new C();output=ctx.createGain();output.gain.value=.8;output.connect(ctx.destination);pianoGain=ctx.createGain();pianoGain.gain.value=.85;pianoGain.connect(output);guitarGain=ctx.createGain();guitarGain.gain.value=.38;guitarGain.connect(output);ambGain=ctx.createGain();ambGain.gain.value=.085;ambGain.connect(output);uiGain=ctx.createGain();uiGain.gain.value=.15;uiGain.connect(output)}

function startAmbient(){unlock();if(ambActive||!ctx||running)return;ambActive=true;ambStep=0;const notes=[261.63,329.63,392,329.63,220,261.63,329.63,261.63,174.61,261.63,349.23,261.63,196,246.94,293.66,246.94];const play=()=>{if(!ambActive||running)return;const t=ctx.currentTime+.025;softTone(notes[ambStep%notes.length],t,1.35,.22);if(ambStep%4===0)softTone([130.81,220,174.61,196][Math.floor(ambStep/4)%4],t,1.9,.12);ambStep++};play();ambTimer=setInterval(play,670)}

const beatWindow=.14*song.bpm*speed/60,candidates=song.melody.filter(n=>!n.done&&n.note===note&&Math.abs(n.beat-now)<=beatWindow).sort((a,b)=>Math.abs(a.beat-now)-Math.abs(b.beat-now));let n=candidates[0];if(!n)return;let dif=Math.abs(n.beat-now)*60/(song.bpm*speed)*1000;let points=dif<=45?100:dif<=90?70:40;n.done=true;score+=points;hits++;judgments++;combo++;maxCombo=Math.max(maxCombo,combo);judge(points===100?'PERFECT!':points===70?'GREAT!':'GOOD!',points===100?'#baffd5':'#ffe09a');$('speech').textContent=combo>=10?'Amazing combo! 🔥':'Nice one! 🎶';updateHUD()}

function start(){unlock();stopAmbient();stop();song=songs[selected];song.melody.forEach(n=>n.done=false);score=combo=maxCombo=judgments=hits=0;running=true;paused=false;waiting=false;nextStrum=0;setTime(-4);$('songTitle').textContent=song.title;$('modeLabel').textContent=mode==='jam'?'JAM MODE 🎸':'PRACTICE 🎼';$('speech').textContent='1, 2, 3, 4!';$('progress').style.width='0%';updateHUD();hide();render();scheduler=setInterval(audioScheduler,35)}
function stop(){running=false;paused=false;waiting=false;clearInterval(scheduler);cancelAnimationFrame(raf)}
function pause(){if(!running)return;if(paused){paused=false;setTime(pauseTime);hide();$('speech').textContent='Let’s go! 🎸'}else{pauseTime=beatNow();paused=true;show(`<h1 class="brand">PAUSED ♫</h1><p class="tag">Your guitarist is right here.</p><div class="settings"><label>Mode <select id="modeSelect"><option value="jam" ${mode==='jam'?'selected':''}>Jam</option><option value="practice" ${mode==='practice'?'selected':''}>Practice</option></select></label><label>Speed <select id="speedSelect"><option value="0.5" ${speed===.5?'selected':''}>50%</option><option value="0.75" ${speed===.75?'selected':''}>75%</option><option value="1" ${speed===1?'selected':''}>100%</option></select></label><label>Wait for notes (Practice) <input id="waitToggle" type="checkbox" ${waitMode?'checked':''}></label><label>Guitar volume <input id="gvol" type="range" min="0" max="100" value="${guitarGain?Math.round(guitarGain.gain.value*100):38}"></label><label>Piano volume <input id="pvol" type="range" min="0" max="100" value="${pianoGain?Math.round(pianoGain.gain.value*100):85}"></label></div><button class="primary" id="resume">RESUME ▶</button><button class="secondary" id="restart">Restart song</button><button class="secondary" id="backSongs">Change song</button>`)} }
function finish(){if(ended)return;ended=true;stop();const pct=judgments?Math.round(hits/judgments*100):0;show(`<h1 class="brand">SONG COMPLETE! 🎉</h1><img class="portrait" src="character.jpg"><p class="tag">That was a great jam session!</p><h2 style="margin:0;font-size:34px">${score.toLocaleString()} ✨</h2><p>Accuracy ${pct}% · Best combo ${maxCombo}</p><button class="primary" id="restart">PLAY AGAIN</button><button class="secondary" id="nextSong">NEXT SONG →</button><button class="secondary" id="backSongs">Songs</button>`);$('speech').textContent='We did it! 🎸'}
function midiText(d,p,n){return String.fromCharCode(...d.slice(p,p+n))}
function readVar(d,pos){let v=0,j=0;while(pos.i<d.length&&j++<4){const b=d[pos.i++];v=(v<<7)|(b&127);if(!(b&128))break}return v}
function importMidi(file){const reader=new FileReader();reader.onerror=()=>{$('importStatus').textContent='File could not be read.'};reader.onload=()=>{try{const d=new Uint8Array(reader.result),dv=new DataView(d.buffer);if(midiText(d,0,4)!=='MThd')throw Error('Not a MIDI file');const headerLength=dv.getUint32(4),tracks=dv.getUint16(10),division=dv.getUint16(12);if(division&32768)throw Error('SMPTE timing is not supported');let p=8+headerLength,tempo=500000,all=[];for(let tr=0;tr<tracks;tr++){if(midiText(d,p,4)!=='MTrk')throw Error('Invalid track');const size=dv.getUint32(p+4),end=p+8+size;let pos={i:p+8},tick=0,running=0,active=new Map(),notes=[];while(pos.i<end){tick+=readVar(d,pos);let status=d[pos.i];if(status&128){pos.i++;running=status}else status=running;if(status===255){const typ=d[pos.i++],len=readVar(d,pos);if(typ===81&&len===3&&tempo===500000)tempo=(d[pos.i]<<16)|(d[pos.i+1]<<8)|d[pos.i+2];pos.i+=len;continue}if(status===240||status===247){pos.i+=readVar(d,pos);continue}const cmd=status&240;if(cmd===128||cmd===144||cmd===160||cmd===176||cmd===224){const key=d[pos.i++],vel=d[pos.i++];if(cmd===144&&vel>0)active.set(key,tick);if(cmd===128||(cmd===144&&vel===0)){if(active.has(key)){const start=active.get(key);notes.push({midi:key,beat:start/division,length:Math.max(.25,(tick-start)/division)});active.delete(key)}}}else if(cmd===192||cmd===208)pos.i++;else throw Error('Invalid MIDI event')}all.push(notes);p=end}
const chosen=all.filter(a=>a.length>=4).sort((a,b)=>b.length-a.length)[0];if(!chosen)throw Error('No playable melody found');const white={0:'C',2:'D',4:'E',5:'F',7:'G',9:'A',11:'B'};const valid=chosen.filter(n=>white[n.midi%12]).slice(0,650).map(n=>({note:white[n.midi%12],beat:n.beat,length:n.length,done:false}));if(valid.length<4)throw Error('Not enough white-key melody notes');const min=Math.min(...valid.map(n=>n.beat));valid.forEach(n=>n.beat=Math.max(0,n.beat-min));const bpm=Math.max(55,Math.min(180,Math.round(60000000/tempo)));const total=Math.max(...valid.map(n=>n.beat+n.length));const imported={title:file.name.replace(/\.midi?$/i,''),subtitle:'Your imported MIDI · Touch practice',bpm,melody:valid,chords:['Am','F','C','G'],difficulty:'CUSTOM',total};songs.push(imported);selected=songs.length-1;show(songSelect());$('importStatus').textContent=`Imported ${valid.length} notes. Black-key notes are omitted in this 7-key mode.`;sparkle();}catch(err){$('importStatus').textContent='Import failed: '+err.message}};reader.readAsArrayBuffer(file)}

function bindKeys(){const root=$('keys');root.innerHTML=letters.map((n,i)=>`<button id="key-${n}" class="key" style="--keycolor:${colors[i]}" aria-label="Piano note ${n}">${n}<span>♪</span></button>`).join('');$('lanes').innerHTML=letters.map(()=>'<div class="lane"></div>').join('');root.querySelectorAll('.key').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);hit(b.id.slice(-1))})});document.addEventListener('keydown',e=>{if(e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;const i=keysMap.indexOf(e.key.toLowerCase());if(i>=0){if(document.activeElement?.tagName==='SELECT')return;e.preventDefault();hit(letters[i])}if(e.code==='Space'&&running){e.preventDefault();if(!$('overlay').classList.contains('hidden')&&$('resume'))pause();else if($('overlay').classList.contains('hidden'))pause()}})}
$('pauseBtn').onclick=()=>pause();$('panel').addEventListener('change',e=>{if(e.target.id==='midiInput'&&e.target.files?.[0]){unlock();importMidi(e.target.files[0])}if(e.target.id==='coverInput'&&e.target.files?.[0]){const f=e.target.files[0];if(window.coverAudioUrl)URL.revokeObjectURL(window.coverAudioUrl);window.coverAudioUrl=URL.createObjectURL(f);const player=document.createElement('audio');player.className='coveraudio';player.controls=true;player.src=window.coverAudioUrl;const box=$('coverPlayer');box.replaceChildren(player);}});$('panel').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.song!=null){selected=+t.dataset.song;show(songSelect());return}switch(t.id){case'choose':case'backSongs':stop();stopAmbient();show(songSelect());break;case'ambience':if(ambActive)stopAmbient();else startAmbient();home();break;case'goHome':home();break;case'start':case'restart':ended=false;start();break;case'nextSong':selected=(selected+1)%songs.length;ended=false;start();break;case'resume':{const selectedMode=$('modeSelect')?.value||mode,selectedSpeed=+$('speedSelect')?.value||speed;const oldBeat=pauseTime;mode=selectedMode;speed=selectedSpeed;waitMode=$('waitToggle')?.checked||false;guitarGain.gain.value=+$('gvol').value/100;pianoGain.gain.value=+$('pvol').value/100;nextStrum=Math.ceil(oldBeat);setTime(oldBeat);paused=false;waiting=false;hide();$('modeLabel').textContent=mode==='jam'?'JAM MODE 🎸':'PRACTICE 🎼';break}}});window.addEventListener('blur',()=>{if(running&&!paused)pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&running&&!paused)pause()});bindKeys();home();
})();
</script></body></html>
